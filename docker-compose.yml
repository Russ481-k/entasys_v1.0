services:
  postgres:
    image: postgres:16.1
    ports:
      - '${DOCKER_DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: $DOCKER_DATABASE_NAME
      POSTGRES_USER: $DOCKER_DATABASE_USERNAME
      POSTGRES_PASSWORD: $DOCKER_DATABASE_PASSWORD
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: '8G'
        reservations:
          cpus: '2'
          memory: '4G'
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=1000'
      - '-c'
      - 'shared_buffers=2GB'
      - '-c'
      - 'effective_cache_size=6GB'
      - '-c'
      - 'maintenance_work_mem=512MB'
      - '-c'
      - 'work_mem=16MB'
      - '-c'
      - 'wal_buffers=16MB'
      - '-c'
      - 'random_page_cost=1.1'
      - '-c'
      - 'effective_io_concurrency=200'
      - '-c'
      - 'checkpoint_completion_target=0.9'
      - '-c'
      - 'synchronous_commit=off'
      - '-c'
      - 'max_wal_size=2GB'
      - '-c'
      - 'min_wal_size=1GB'
      - '-c'
      - 'autovacuum_max_workers=3'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    shm_size: '2gb'

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch
    networks:
      - palolog
    ports:
      - '9200:9200'
      - '9600:9600'
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=PaloLog2024!@#$
      - plugins.security.disabled=true
      - 'OPENSEARCH_JAVA_OPTS=-Xms12g -Xmx12g'
      - bootstrap.memory_lock=true
      - TZ=Asia/Seoul
      - 'search.max_open_scroll_context=1000'
      - 'indices.memory.index_buffer_size=20%'
      - 'indices.queries.cache.size=15%'
      - 'thread_pool.write.queue_size=1000'
      - 'thread_pool.search.queue_size=1000'
      - 'indices.fielddata.cache.size=20%'
      - 'indices.recovery.max_bytes_per_sec=100mb'
      - 'cluster.routing.allocation.disk.threshold_enabled=false'
      - 'action.auto_create_index=true'
      - 'action.destructive_requires_name=false'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./certs:/usr/share/opensearch/config/certs
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -k -s http://localhost:9200/_cluster/health || exit 1',
        ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 40s
    shm_size: '1gb'

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: logstash
    networks:
      - palolog
    ports:
      - '514:514/udp'
    environment:
      LS_JAVA_OPTS: '-Xms8g -Xmx8g'
      pipeline.batch.size: '50000'
      pipeline.workers: '12'
      pipeline.batch.delay: '3'
      pipeline.io_threads: '6'
      pipeline.ordered: 'false'
      pipeline.unsafe_shutdown: 'true'
      pipeline.ecs_compatibility: disabled
      queue.type: memory
      queue.max_bytes: '16gb'
      queue.checkpoint.writes: '50000'
      queue.checkpoint.acks: '50000'
      queue.checkpoint.interval: '1000'
      queue.page_capacity: '512mb'
      queue.max_pages: 8
      queue.max_events: '50000'
      queue.drain: 'true'
      TZ: Asia/Seoul
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: '12G'
        reservations:
          cpus: '4'
          memory: '8G'
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    command: logstash -f /usr/share/logstash/pipeline/logstash.conf --config.reload.automatic
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 65535
        hard: 65535
    shm_size: '2gb'

networks:
  palolog:
    driver: bridge

volumes:
  opensearch-data:
