name: entasys-new
services:
  postgres:
    image: postgres:16.1
    restart: unless-stopped
    ports:
      - '${DOCKER_DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: $DOCKER_DATABASE_NAME
      POSTGRES_USER: $DOCKER_DATABASE_USERNAME
      POSTGRES_PASSWORD: $DOCKER_DATABASE_PASSWORD
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '1G'
        reservations:
          cpus: '0.5'
          memory: '512M'
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=100'
      - '-c'
      - 'shared_buffers=128MB'
      - '-c'
      - 'effective_cache_size=256MB'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - palolog

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    networks:
      - palolog

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    restart: unless-stopped
    container_name: opensearch
    networks:
      - palolog
    ports:
      - '9200:9200'
      - '9600:9600'
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=PaloLog2024!@#$
      - plugins.security.disabled=true
      - 'OPENSEARCH_JAVA_OPTS=-Xms768m -Xmx768m'
      - bootstrap.memory_lock=true
    deploy:
      resources:
        limits:
          memory: '1.5G'
        reservations:
          memory: '1G'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  logstash-producer:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    restart: unless-stopped
    container_name: logstash-producer
    depends_on:
      kafka:
        condition: service_started
      opensearch:
        condition: service_healthy
    networks:
      - palolog
    ports:
      - '514:514/udp'
    environment:
      - 'LS_JAVA_OPTS=-Xms256m -Xmx256m'
      - 'pipeline.workers=2'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '512M'
        reservations:
          cpus: '0.25'
          memory: '256M'
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    command: logstash -f /usr/share/logstash/pipeline/producer/producer.conf --config.reload.automatic
    user: root

  logstash-consumer:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    restart: unless-stopped
    container_name: logstash-consumer
    depends_on:
      kafka:
        condition: service_started
      opensearch:
        condition: service_healthy
    networks:
      - palolog
    environment:
      - 'LS_JAVA_OPTS=-Xms256m -Xmx256m'
      - 'pipeline.workers=2'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '512M'
        reservations:
          cpus: '0.25'
          memory: '256M'
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    command: logstash -f /usr/share/logstash/pipeline/consumer/consumer.conf --config.reload.automatic
    user: root

networks:
  palolog:
    driver: bridge

volumes:
  opensearch-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
