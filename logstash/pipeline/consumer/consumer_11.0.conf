input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["log_topic_v11.0"]
    group_id => "logstash-group-v11.0"
    codec => json
    auto_offset_reset => "earliest"  # 가장 오래된 메시지부터 처리
    consumer_threads => 4  # 병렬 처리 스레드 수
    fetch_max_bytes => 1048576  # 한 번에 가져올 수 있는 최대 바이트 수
    max_poll_records => 500  # 한 번에 가져올 수 있는 최대 레코드 수
    session_timeout_ms => 30000  # 세션 타임아웃
    heartbeat_interval_ms => 10000  # 하트비트 간격
  }
}

filter {
  # 인덱스 이름 생성
  ruby {
    init => '
      require "set"
      @domains = Set.new
    '
    code => '
      begin
        # 인덱싱을 위한 도메인 처리
        original_domain = event.get("original_domain") || event.get("domain") || "unknown"
        index_domain = original_domain.downcase
                .gsub(/\./, "-")
                .gsub(/[^a-z0-9\-]/, "_")
                .gsub(/-+/, "-")
                .gsub(/_+/, "_")

        # 원래 이벤트의 인덱스 이름 설정
        kst_time = event.get("@timestamp").time.getlocal("+09:00")
        index_name = "#{kst_time.strftime("%Y.%m.%d.%H")}_#{index_domain}".downcase
        event.set("[@metadata][index_name]", index_name)

      rescue => e
        logger.error("Error in Ruby filter: #{e.message}")
        logger.error(e.backtrace.join("\n"))
        event.tag("_rubyparsefalure")
        event.set("[@metadata][index_name]", "error-logs-#{Time.now.strftime("%Y.%m.%d")}")
      end
    '
  }

  # Convert timeLogged to ISO8601 format
  ruby {
    code => "
      require 'date'
      begin
        time = DateTime.strptime(event.get('timeLogged'), '%Y/%m/%d %H:%M:%S')
        event.set('timeLogged', time.iso8601)
      rescue => e
        event.tag('_timeLogged_parse_failure')
      end
    "
  }

  # Convert timeLogged field to proper date format
  date {
    match => [ "timeLogged", "ISO8601" ]
    target => "timeLogged"
    timezone => "Asia/Seoul"
    locale => "en"
  }

  # Convert startTime field to proper date format
  date {
    match => [ "startTime", "yyyy/MM/dd HH:mm:ss" ]
    target => "startTime"
    timezone => "Asia/Seoul"
  }

  # Convert receiveTime field to proper date format
  date {
    match => [ "receiveTime", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'" ]
    target => "receiveTime"
    timezone => "Asia/Seoul"
  }

  date {
    match => [ "d001", "yyyy/MM/dd HH:mm:ss" ]
    target => "@timestamp"
    timezone => "Asia/Seoul"
  }

  date {
    match => [ "generateTime", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'" ]
    target => "generateTime"
    timezone => "Asia/Seoul"
  }

